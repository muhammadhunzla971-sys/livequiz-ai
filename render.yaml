# Render Blueprint: one click "New > Blueprint" creates the API, Postgres and Redis (Key Value).
# The frontend lives on Vercel (see docs/DEPLOYMENT.md). Free plans sleep when idle and the free
# Postgres may expire: fine for a demo, use paid plans for real classes.
databases:
  - name: livequiz-db
    plan: free
    databaseName: livequiz
    user: livequiz

services:
  - type: keyvalue
    name: livequiz-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: livequiz-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: REDIS_MAX_CONNECTIONS
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: livequiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: livequiz-redis
          property: connectionString
      # Fill these in the Render dashboard after the first deploy:
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_PRIMARY_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-20b
